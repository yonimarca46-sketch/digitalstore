function AdminOrders({ db, setDb }) {
  const [toast, setToast] = useState(null);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 3000);
    return () => clearTimeout(t);
  }, [toast]);

  function handleChangeStatus(orderId, status) {
    setDb((prev) => {
      const order = prev.orders.find((o) => o.id === orderId);
      let products = prev.products;
      let deliveredKey = order ? order.delivered_key : null;

      // Punto 8: al pasar un pedido a "pagado" o "entregado" (Completado/Pagado),
      // si el producto maneja inventario de claves/licencias, se descuenta
      // automáticamente una clave del stock y se adjunta al pedido.
      const becomingCompleted = (status === "pagado" || status === "entregado");
      if (order && becomingCompleted && !order.delivered_key) {
        const product = prev.products.find((p) => p.id === order.product_id);
        if (product && Array.isArray(product.license_keys) && product.license_keys.length > 0) {
          const [nextKey, ...restKeys] = product.license_keys;
          deliveredKey = nextKey;
          products = prev.products.map((p) => p.id === product.id ? { ...p, license_keys: restKeys, stock: restKeys.length } : p);
          setToast(`✓ Clave asignada automáticamente al pedido de ${order.customer_name}`);
        }
      }

      const orders = prev.orders.map((o) => (o.id === orderId ? { ...o, status, delivered_key: deliveredKey } : o));
      const next = { ...prev, orders, products };
      saveDB(next);
      return next;
    });
  }

  function handleDeleteOrder(orderId) {
    if (!confirm("¿Eliminar este pedido? Esta acción no se puede deshacer.")) return;
    setDb((prev) => {
      const next = { ...prev, orders: prev.orders.filter((o) => o.id !== orderId) };
      saveDB(next);
      return next;
    });
  }

  return (
    <div>
      <h1 style={{ margin: "0 0 20px", fontSize: 22, fontWeight: 700 }}>Órdenes</h1>
      {toast && <div className="fade-in" style={{ marginBottom: 16, borderRadius: 10, border: "1px solid var(--success-500)", background: "rgba(34,197,94,.1)", color: "var(--success-500)", padding: "8px 14px", fontSize: 12 }}>{toast}</div>}
      <OrdersTable db={db} orders={db.orders} onChangeStatus={handleChangeStatus} onDeleteOrder={handleDeleteOrder} />
    </div>
  );
}

const emptyProductForm = { title: "", description: "", stock: "0", category_id: "", image_url: "", features: "", is_active: true, plans: [{ id: uid(), duration_label: "1 mes", price: "" }], license_keys: "" };

/* Lee un archivo de imagen, lo redimensiona (máx 800px de ancho) y lo comprime
   a JPEG para que quepa cómodamente en localStorage como data URL. */
function compressImageToDataURL(file, maxWidth = 800, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read error"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("image error"));
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function AdminProducts({ db, setDb }) {
  const [editing, setEditing] = useState(null); // product id or "new" or null
  const [form, setForm] = useState(emptyProductForm);
  const [imgError, setImgError] = useState(null);

  function startNew() { setForm(emptyProductForm); setImgError(null); setEditing("new"); }
  function startEdit(p) {
    setForm({
      title: p.title, description: p.description || "", stock: String(p.stock), category_id: p.category_id || "", image_url: p.image_url || "",
      features: p.features.join(", "), is_active: p.is_active,
      plans: (p.plans || []).map((pl) => ({ id: pl.id, duration_label: pl.duration_label, price: String(pl.price) })),
      license_keys: (p.license_keys || []).join("\n"),
    });
    setImgError(null);
    setEditing(p.id);
  }
  function cancel() { setEditing(null); setForm(emptyProductForm); setImgError(null); }

  function addPlan() {
    setForm((f) => ({ ...f, plans: [...f.plans, { id: uid(), duration_label: "1 mes", price: "" }] }));
  }
  function updatePlan(id, patch) {
    setForm((f) => ({ ...f, plans: f.plans.map((pl) => pl.id === id ? { ...pl, ...patch } : pl) }));
  }
  function removePlan(id) {
    setForm((f) => ({ ...f, plans: f.plans.filter((pl) => pl.id !== id) }));
  }

  const validPlans = form.plans.filter((pl) => pl.duration_label.trim() && pl.price !== "");

  function save() {
    if (!form.title.trim() || validPlans.length === 0) return;
    const featuresArr = form.features.split(",").map((s) => s.trim()).filter(Boolean);
    const plansArr = validPlans.map((pl) => ({ id: pl.id, duration_label: pl.duration_label.trim(), price: parseFloat(pl.price) || 0 }));
    const licenseKeysArr = form.license_keys.split("\n").map((s) => s.trim()).filter(Boolean);
    // Si el admin gestiona claves/licencias, el stock lo dicta automáticamente
    // la cantidad de claves disponibles (así nunca se vende algo que ya no hay).
    const effectiveStock = licenseKeysArr.length > 0 ? licenseKeysArr.length : (parseInt(form.stock) || 0);
    setDb((prev) => {
      let products;
      if (editing === "new") {
        const newProduct = {
          id: uid(), title: form.title.trim(), slug: form.title.trim().toLowerCase().replace(/\s+/g, "-"),
          category_id: form.category_id || null, description: form.description.trim(), image_url: form.image_url || null,
          stock: effectiveStock, is_active: form.is_active, features: featuresArr, plans: plansArr, license_keys: licenseKeysArr,
        };
        products = [newProduct, ...prev.products];
      } else {
        products = prev.products.map((p) => p.id === editing ? {
          ...p, title: form.title.trim(), category_id: form.category_id || null, description: form.description.trim(), image_url: form.image_url || null,
          stock: effectiveStock, is_active: form.is_active, features: featuresArr, plans: plansArr, license_keys: licenseKeysArr,
        } : p);
      }
      const next = { ...prev, products };
      saveDB(next);
      return next;
    });
    cancel();
  }

  function remove(id) {
    if (!confirm("¿Eliminar este producto?")) return;
    setDb((prev) => {
      const next = { ...prev, products: prev.products.filter((p) => p.id !== id) };
      saveDB(next);
      return next;
    });
  }

  function toggleActive(id) {
    setDb((prev) => {
      const next = { ...prev, products: prev.products.map((p) => p.id === id ? { ...p, is_active: !p.is_active } : p) };
      saveDB(next);
      return next;
    });
  }

  const inputStyle = { width: "100%", borderRadius: 8, border: "1px solid var(--base-700)", background: "var(--base-800)", padding: "8px 12px", fontSize: 13, color: "#fff", colorScheme: "dark" };
  const labelStyle = { display: "block", marginBottom: 4, fontSize: 12, color: "#9ca3af" };

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20 }}>
        <h1 style={{ margin: 0, fontSize: 22, fontWeight: 700 }}>Productos</h1>
        <button onClick={startNew} style={{ display: "flex", alignItems: "center", gap: 6, borderRadius: 999, border: "none", background: "var(--accent-500)", color: "#05060a", padding: "8px 14px", fontSize: 13, fontWeight: 600 }}>
          <Icon.Plus style={{ width: 14, height: 14 }} /> Nuevo producto
        </button>
      </div>

      {editing && (
        <div className="fade-in" style={{ marginBottom: 24, borderRadius: 16, border: "1px solid var(--base-700)", background: "rgba(18,22,35,.6)", padding: 20 }}>
          <h2 style={{ marginTop: 0, fontSize: 15, fontWeight: 600 }}>{editing === "new" ? "Nuevo producto" : "Editar producto"}</h2>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(200px,1fr))", gap: 12, marginBottom: 12 }}>
            <div><label style={labelStyle}>Título</label><input style={inputStyle} value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} /></div>
            <div><label style={labelStyle}>Stock</label><input type="number" style={inputStyle} value={form.stock} onChange={(e) => setForm({ ...form, stock: e.target.value })} /></div>
            <div>
              <label style={labelStyle}>Categoría</label>
              <Dropdown
                value={form.category_id}
                onChange={(v) => setForm({ ...form, category_id: v })}
                buttonStyle={{ width: "100%" }}
                options={[{ value: "", label: "Sin categoría" }, ...db.categories.map((c) => ({ value: c.id, label: c.name }))]}
              />
            </div>
            <div>
              <label style={labelStyle}>Imagen del producto</label>
              <input
                type="file"
                accept="image/*"
                onChange={(e) => {
                  const file = e.target.files && e.target.files[0];
                  if (!file) return;
                  setImgError(null);
                  compressImageToDataURL(file)
                    .then((dataUrl) => setForm((f) => ({ ...f, image_url: dataUrl })))
                    .catch(() => setImgError("No se pudo leer la imagen. Intenta con otro archivo."));
                }}
                style={{ ...inputStyle, padding: "6px 8px", cursor: "pointer" }}
              />
              {imgError && <p style={{ margin: "6px 0 0", fontSize: 11, color: "var(--signal-400)" }}>{imgError}</p>}
            </div>
          </div>

          <div style={{ marginBottom: 12 }}>
            <label style={labelStyle}>Descripción</label>
            <textarea rows={3} style={{ ...inputStyle, resize: "vertical", fontFamily: "inherit" }} value={form.description}
              onChange={(e) => setForm({ ...form, description: e.target.value })}
              placeholder="Describe el producto: qué incluye, para quién es, qué lo hace especial..." />
          </div>

          <div style={{ marginBottom: 12 }}>
            <label style={labelStyle}>Planes de duración y precio</label>
            <p style={{ margin: "0 0 8px", fontSize: 11, color: "#6b7280" }}>Elige tú qué duraciones ofrecer para este producto (1 mes, 2 meses, 3 meses, por año, etc.). No hace falta agregar todas — solo las que apliquen.</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {form.plans.map((pl) => {
                const isPreset = DURATION_PRESETS.includes(pl.duration_label);
                return (
                  <div key={pl.id} style={{ display: "grid", gridTemplateColumns: isPreset ? "1fr 1fr auto" : "1fr 1fr 1fr auto", gap: 8, alignItems: "center" }}>
                    <Dropdown
                      value={isPreset ? pl.duration_label : "custom"}
                      onChange={(v) => updatePlan(pl.id, { duration_label: v === "custom" ? "" : v })}
                      buttonStyle={{ width: "100%" }}
                      options={[...DURATION_PRESETS.map((d) => ({ value: d, label: d })), { value: "custom", label: "Personalizada…" }]}
                    />
                    {!isPreset && (
                      <input style={inputStyle} placeholder="Ej: 2 meses" value={pl.duration_label} onChange={(e) => updatePlan(pl.id, { duration_label: e.target.value })} />
                    )}
                    <input type="number" style={inputStyle} placeholder="Precio (S/)" value={pl.price} onChange={(e) => updatePlan(pl.id, { price: e.target.value })} />
                    <button type="button" onClick={() => removePlan(pl.id)} style={{ background: "none", border: "none", color: "var(--signal-400)", padding: 4 }}><Icon.Trash style={{ width: 15, height: 15 }} /></button>
                  </div>
                );
              })}
            </div>
            <button type="button" onClick={addPlan} style={{ marginTop: 8, display: "flex", alignItems: "center", gap: 6, borderRadius: 999, border: "1px solid var(--base-700)", background: "transparent", color: "var(--accent-400)", padding: "6px 12px", fontSize: 12 }}>
              <Icon.Plus style={{ width: 12, height: 12 }} /> Agregar plan
            </button>
            {form.plans.length > 0 && validPlans.length === 0 && (
              <p style={{ margin: "6px 0 0", fontSize: 11, color: "var(--signal-400)" }}>Agrega al menos un plan con duración y precio válidos.</p>
            )}
          </div>

          {form.image_url && (
            <div style={{ marginBottom: 12, display: "flex", alignItems: "center", gap: 12 }}>
              <img src={form.image_url} alt="Vista previa" style={{ width: 80, height: 60, objectFit: "cover", borderRadius: 8, border: "1px solid var(--base-700)" }} />
              <button type="button" onClick={() => setForm((f) => ({ ...f, image_url: "" }))} style={{ background: "none", border: "1px solid var(--base-700)", color: "#9ca3af", borderRadius: 999, padding: "4px 12px", fontSize: 12 }}>Quitar imagen</button>
            </div>
          )}
          <div style={{ marginBottom: 12 }}>
            <label style={labelStyle}>Características (separadas por coma)</label>
            <input style={inputStyle} value={form.features} onChange={(e) => setForm({ ...form, features: e.target.value })} placeholder="Ej: Acceso ilimitado, Soporte 24/7" />
          </div>
          <div style={{ marginBottom: 12 }}>
            <label style={labelStyle}><Icon.Key style={{ width: 12, height: 12, display: "inline", marginRight: 4, verticalAlign: "-1px" }} />Claves / licencias digitales (una por línea, opcional)</label>
            <textarea rows={4} style={{ ...inputStyle, resize: "vertical", fontFamily: "monospace", fontSize: 12 }} value={form.license_keys}
              onChange={(e) => setForm({ ...form, license_keys: e.target.value })}
              placeholder={"XXXX-XXXX-XXXX-XXXX\nYYYY-YYYY-YYYY-YYYY"} />
            <p style={{ margin: "6px 0 0", fontSize: 11, color: "#6b7280" }}>
              Si llenas este campo, el stock se calcula automáticamente según cuántas claves quedan (una se descuenta y se entrega sola cada vez que marcas un pedido como pagado/entregado). Déjalo vacío para llevar el stock manualmente.
            </p>
          </div>
          <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: "#d1d5db", marginBottom: 16 }}>
            <input type="checkbox" checked={form.is_active} onChange={(e) => setForm({ ...form, is_active: e.target.checked })} /> Activo (visible en la tienda)
          </label>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={save} disabled={!form.title.trim() || validPlans.length === 0} style={{ borderRadius: 999, border: "none", background: "var(--success-500)", color: "#fff", padding: "8px 16px", fontSize: 13, fontWeight: 600, opacity: (!form.title.trim() || validPlans.length === 0) ? 0.5 : 1, cursor: (!form.title.trim() || validPlans.length === 0) ? "not-allowed" : "pointer" }}>Guardar</button>
            <button onClick={cancel} style={{ borderRadius: 999, border: "1px solid var(--base-700)", background: "transparent", color: "#9ca3af", padding: "8px 16px", fontSize: 13 }}>Cancelar</button>
          </div>
        </div>
      )}

      <div style={{ overflowX: "auto", borderRadius: 12, border: "1px solid var(--base-700)" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
          <thead>
            <tr style={{ background: "var(--base-800)", textAlign: "left" }}>
              <th style={{ padding: "10px 12px", color: "#9ca3af", fontWeight: 500 }}>Producto</th>
              <th style={{ padding: "10px 12px", color: "#9ca3af", fontWeight: 500 }}>Precio</th>
              <th style={{ padding: "10px 12px", color: "#9ca3af", fontWeight: 500 }}>Stock</th>
              <th style={{ padding: "10px 12px", color: "#9ca3af", fontWeight: 500 }}>Estado</th>
              <th style={{ padding: "10px 12px", color: "#9ca3af", fontWeight: 500 }}></th>
            </tr>
          </thead>
          <tbody>
            {db.products.map((p) => (
              <tr key={p.id} style={{ borderTop: "1px solid var(--base-700)" }}>
                <td style={{ padding: "10px 12px" }}>{p.title}<br /><span style={{ color: "#6b7280", fontSize: 11 }}>{(p.plans || []).map((pl) => pl.duration_label).join(" · ")}</span></td>
                <td style={{ padding: "10px 12px" }}>
                  {(p.plans || []).map((pl) => (
                    <div key={pl.id} style={{ whiteSpace: "nowrap" }}>S/ {pl.price.toFixed(2)} <span style={{ color: "#6b7280", fontSize: 11 }}>({pl.duration_label})</span></div>
                  ))}
                </td>
                <td style={{ padding: "10px 12px" }}>{p.stock}</td>
                <td style={{ padding: "10px 12px" }}>
                  <button onClick={() => toggleActive(p.id)} style={{ borderRadius: 999, border: "none", padding: "4px 10px", fontSize: 11, cursor: "pointer",
                    background: p.is_active ? "rgba(34,197,94,.15)" : "rgba(255,45,77,.15)", color: p.is_active ? "var(--success-500)" : "var(--signal-400)" }}>
                    {p.is_active ? "activo" : "pausado"}
                  </button>
                </td>
                <td style={{ padding: "10px 12px", whiteSpace: "nowrap" }}>
                  <button onClick={() => startEdit(p)} style={{ background: "none", border: "none", color: "var(--accent-400)", marginRight: 8, padding: 4 }}><Icon.Edit style={{ width: 15, height: 15 }} /></button>
                  <button onClick={() => remove(p.id)} style={{ background: "none", border: "none", color: "var(--signal-400)", padding: 4 }}><Icon.Trash style={{ width: 15, height: 15 }} /></button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ============================================================
   ADMIN — CATEGORÍAS (100% dinámico, reemplaza SEED_CATEGORIES)
   ============================================================ */
const emptyCategoryForm = { name: "", slug: "", icon: "" };

function AdminCategories({ db, setDb }) {
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState(emptyCategoryForm);
  const [uploading, setUploading] = useState(false);

  const inputStyle = { width: "100%", borderRadius: 8, border: "1px solid var(--base-700)", background: "var(--base-800)", padding: "8px 12px", fontSize: 13, color: "#fff", colorScheme: "dark" };
  const labelStyle = { display: "block", marginBottom: 4, fontSize: 12, color: "#9ca3af" };

  function startNew() { setForm(emptyCategoryForm); setEditing("new"); }
  function startEdit(c) { setForm({ name: c.name, slug: c.slug, icon: c.icon || "" }); setEditing(c.id); }
  function cancel() { setEditing(null); setForm(emptyCategoryForm); }

  function slugify(s) { return s.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, ""); }

  function save() {
    if (!form.name.trim()) return;
    const slug = form.slug.trim() ? slugify(form.slug) : slugify(form.name);
    setDb((prev) => {
      let categories;
      if (editing === "new") {
        categories = [...prev.categories, { id: uid(), name: form.name.trim(), slug, icon: form.icon.trim() }];
      } else {
        categories = prev.categories.map((c) => c.id === editing ? { ...c, name: form.name.trim(), slug, icon: form.icon.trim() } : c);
      }
      const next = { ...prev, categories };
      saveDB(next);
      return next;
    });
    cancel();
  }

  function remove(id) {
    if (!confirm("¿Eliminar esta categoría? Los productos que la usan quedarán sin categoría.")) return;
    setDb((prev) => {
      const next = {
        ...prev,
        categories: prev.categories.filter((c) => c.id !== id),
        products: prev.products.map((p) => (p.category_id === id ? { ...p, category_id: null } : p)),
      };
      saveDB(next);
      return next;
    });
  }

  function handleIconFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setUploading(true);
    uploadImageSmart(file, "categorias").then((url) => { setForm((f) => ({ ...f, icon: url })); setUploading(false); }).catch(() => setUploading(false));
  }

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20 }}>
        <h1 style={{ margin: 0, fontSize: 22, fontWeight: 700 }}>Categorías</h1>
        <button onClick={startNew} style={{ display: "flex", alignItems: "center", gap: 6, borderRadius: 999, border: "none", background: "var(--accent-500)", color: "#05060a", padding: "8px 14px", fontSize: 13, fontWeight: 600 }}>
          <Icon.Plus style={{ width: 14, height: 14 }} /> Nueva categoría
        </button>
      </div>

      {editing && (
        <div className="fade-in" style={{ marginBottom: 24, borderRadius: 16, border: "1px solid var(--base-700)", background: "rgba(18,22,35,.6)", padding: 20, maxWidth: 480 }}>
          <h2 style={{ marginTop: 0, fontSize: 15, fontWeight: 600 }}>{editing === "new" ? "Nueva categoría" : "Editar categoría"}</h2>
          <div style={{ marginBottom: 12 }}><label style={labelStyle}>Nombre</label><input style={inputStyle} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="Ej: Cursos Online" /></div>
          <div style={{ marginBottom: 12 }}><label style={labelStyle}>Slug (opcional, se genera solo)</label><input style={inputStyle} value={form.slug} onChange={(e) => setForm({ ...form, slug: e.target.value })} placeholder="cursos-online" /></div>
          <div style={{ marginBottom: 12 }}>
            <label style={labelStyle}>Ícono (emoji, ej: 🎓) o imagen</label>
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <input style={{ ...inputStyle, maxWidth: 120 }} value={form.icon && !form.icon.startsWith("http") ? form.icon : ""} onChange={(e) => setForm({ ...form, icon: e.target.value })} placeholder="🎓" />
              <input type="file" accept="image/*" onChange={handleIconFile} style={{ fontSize: 12 }} />
            </div>
            {uploading && <p style={{ margin: "6px 0 0", fontSize: 11, color: "var(--accent-400)" }}>Subiendo imagen...</p>}
            {form.icon && form.icon.startsWith("http") && (
              <div style={{ marginTop: 8, display: "flex", alignItems: "center", gap: 8 }}>
                <img src={form.icon} alt="ícono" style={{ width: 32, height: 32, borderRadius: 6, objectFit: "cover" }} />
                <button type="button" onClick={() => setForm((f) => ({ ...f, icon: "" }))} style={{ background: "none", border: "1px solid var(--base-700)", color: "#9ca3af", borderRadius: 999, padding: "2px 10px", fontSize: 11 }}>Quitar</button>
              </div>
            )}
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={save} disabled={!form.name.trim()} style={{ borderRadius: 999, border: "none", background: "var(--success-500)", color: "#fff", padding: "8px 16px", fontSize: 13, fontWeight: 600, opacity: !form.name.trim() ? 0.5 : 1 }}>Guardar</button>
            <button onClick={cancel} style={{ borderRadius: 999, border: "1px solid var(--base-700)", background: "transparent", color: "#9ca3af", padding: "8px 16px", fontSize: 13 }}>Cancelar</button>
          </div>
        </div>
      )}

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(220px,1fr))", gap: 12 }}>
        {db.categories.map((c) => (
          <div key={c.id} style={{ borderRadius: 12, border: "1px solid var(--base-700)", background: "rgba(18,22,35,.6)", padding: 14, display: "flex", alignItems: "center", gap: 10 }}>
            {c.icon && c.icon.startsWith("http") ? <img src={c.icon} alt="" style={{ width: 28, height: 28, borderRadius: 6, objectFit: "cover" }} /> : <span style={{ fontSize: 22 }}>{c.icon || "📦"}</span>}
            <div style={{ flex: 1, minWidth: 0 }}>
              <p style={{ margin: 0, fontSize: 13, fontWeight: 600 }} className="line-clamp-1">{c.name}</p>
              <p style={{ margin: 0, fontSize: 11, color: "#6b7280" }}>{c.slug}</p>
            </div>
            <button onClick={() => startEdit(c)} style={{ background: "none", border: "none", color: "var(--accent-400)", padding: 4 }}><Icon.Edit style={{ width: 14, height: 14 }} /></button>
            <button onClick={() => remove(c.id)} style={{ background: "none", border: "none", color: "var(--signal-400)", padding: 4 }}><Icon.Trash style={{ width: 14, height: 14 }} /></button>
          </div>
        ))}
        {db.categories.length === 0 && <p style={{ color: "#6b7280", fontSize: 13 }}>Sin categorías todavía.</p>}
      </div>
    </div>
  );
}

/* ============================================================
   ADMIN — CUPONES DE DESCUENTO
   ============================================================ */
const emptyCouponForm = { code: "", type: "percent", value: "", active: true };

function AdminCoupons({ db, setDb }) {
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState(emptyCouponForm);
  const inputStyle = { width: "100%", borderRadius: 8, border: "1px solid var(--base-700)", background: "var(--base-800)", padding: "8px 12px", fontSize: 13, color: "#fff", colorScheme: "dark" };
  const labelStyle = { display: "block", marginBottom: 4, fontSize: 12, color: "#9ca3af" };

  function startNew() { setForm(emptyCouponForm); setEditing("new"); }
  function startEdit(c) { setForm({ code: c.code, type: c.type, value: String(c.value), active: c.active }); setEditing(c.id); }
  function cancel() { setEditing(null); setForm(emptyCouponForm); }

  function save() {
    if (!form.code.trim() || form.value === "") return;
    const data = { code: form.code.trim().toUpperCase(), type: form.type, value: parseFloat(form.value) || 0, active: form.active };
    setDb((prev) => {
      let coupons = prev.coupons || [];
      coupons = editing === "new" ? [{ id: uid(), ...data }, ...coupons] : coupons.map((c) => c.id === editing ? { ...c, ...data } : c);
      const next = { ...prev, coupons };
      saveDB(next);
      return next;
    });
    cancel();
  }
  function remove(id) {
    if (!confirm("¿Eliminar este cupón?")) return;
    setDb((prev) => { const next = { ...prev, coupons: (prev.coupons || []).filter((c) => c.id !== id) }; saveDB(next); return next; });
  }
  function toggleActive(id) {
    setDb((prev) => { const next = { ...prev, coupons: (prev.coupons || []).map((c) => c.id === id ? { ...c, active: !c.active } : c) }; saveDB(next); return next; });
  }

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20 }}>
        <h1 style={{ margin: 0, fontSize: 22, fontWeight: 700 }}>Cupones de descuento</h1>
        <button onClick={startNew} style={{ display: "flex", alignItems: "center", gap: 6, borderRadius: 999, border: "none", background: "var(--accent-500)", color: "#05060a", padding: "8px 14px", fontSize: 13, fontWeight: 600 }}>
          <Icon.Plus style={{ width: 14, height: 14 }} /> Nuevo cupón
        </button>
      </div>

      {editing && (
        <div className="fade-in" style={{ marginBottom: 24, borderRadius: 16, border: "1px solid var(--base-700)", background: "rgba(18,22,35,.6)", padding: 20, maxWidth: 420 }}>
          <h2 style={{ marginTop: 0, fontSize: 15, fontWeight: 600 }}>{editing === "new" ? "Nuevo cupón" : "Editar cupón"}</h2>
          <div style={{ marginBottom: 12 }}><label style={labelStyle}>Código</label><input style={{ ...inputStyle, textTransform: "uppercase" }} value={form.code} onChange={(e) => setForm({ ...form, code: e.target.value })} placeholder="BIENVENIDA10" /></div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }}>
            <div>
              <label style={labelStyle}>Tipo</label>
              <Dropdown
                value={form.type}
                onChange={(v) => setForm({ ...form, type: v })}
                buttonStyle={{ width: "100%" }}
                options={[
                  { value: "percent", label: "Porcentaje (%)" },
                  { value: "fixed", label: "Monto fijo (S/)" },
                ]}
              />
            </div>
            <div><label style={labelStyle}>Valor</label><input type="number" style={inputStyle} value={form.value} onChange={(e) => setForm({ ...form, value: e.target.value })} placeholder={form.type === "percent" ? "10" : "5.00"} /></div>
          </div>
          <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: "#d1d5db", marginBottom: 16 }}>
            <input type="checkbox" checked={form.active} onChange={(e) => setForm({ ...form, active: e.target.checked })} /> Activo
          </label>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={save} disabled={!form.code.trim() || form.value === ""} style={{ borderRadius: 999, border: "none", background: "var(--success-500)", color: "#fff", padding: "8px 16px", fontSize: 13, fontWeight: 600, opacity: (!form.code.trim() || form.value === "") ? 0.5 : 1 }}>Guardar</button>
            <button onClick={cancel} style={{ borderRadius: 999, border: "1px solid var(--base-700)", background: "transparent", color: "#9ca3af", padding: "8px 16px", fontSize: 13 }}>Cancelar</button>
          </div>
        </div>
      )}

    if (!confirm("¿Eliminar esta reseña?")) return;

              <p style={{ margin: "0 0 10px", fontSize: 13, color: "#d1d5db" }}>{r.comment}</p>
              <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                <span style={{ borderRadius: 999, padding: "3px 10px", fontSize: 11, background: r.approved ? "rgba(34,197,94,.15)" : "rgba(255,45,77,.15)", color: r.approved ? "var(--success-500)" : "var(--signal-400)" }}>
                  {r.approved ? "aprobada / visible" : "pendiente de revisión"}

        })}

      </div>
    </div>
  );

const emptyFaqForm = { question: "", answer: "" };

function AdminFAQ({ db, setDb }) {
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState(emptyFaqForm);
  const inputStyle = { width: "100%", borderRadius: 8, border: "1px solid var(--base-700)", background: "var(--base-800)", padding: "8px 12px", fontSize: 13, color: "#fff", colorScheme: "dark" };
  const labelStyle = { display: "block", marginBottom: 4, fontSize: 12, color: "#9ca3af" };

  function startNew() { setForm(emptyFaqForm); setEditing("new"); }
  function startEdit(f) { setForm({ question: f.question, answer: f.answer }); setEditing(f.id); }
  function cancel() { setEditing(null); setForm(emptyFaqForm); }

  function save() {
    if (!form.question.trim() || !form.answer.trim()) return;
    setDb((prev) => {
      let faqs = prev.faqs || [];
      if (editing === "new") {
        faqs = [...faqs, { id: uid(), question: form.question.trim(), answer: form.answer.trim(), order: faqs.length + 1 }];
      } else {
        faqs = faqs.map((f) => f.id === editing ? { ...f, question: form.question.trim(), answer: form.answer.trim() } : f);
      }
      const next = { ...prev, faqs };
      saveDB(next);
      return next;
    });
    cancel();
  }
  function remove(id) {
    if (!confirm("¿Eliminar esta pregunta?")) return;
    setDb((prev) => { const next = { ...prev, faqs: (prev.faqs || []).filter((f) => f.id !== id) }; saveDB(next); return next; });
  }

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20 }}>
        <h1 style={{ margin: 0, fontSize: 22, fontWeight: 700 }}>Preguntas frecuentes</h1>
        <button onClick={startNew} style={{ display: "flex", alignItems: "center", gap: 6, borderRadius: 999, border: "none", background: "var(--accent-500)", color: "#05060a", padding: "8px 14px", fontSize: 13, fontWeight: 600 }}>
          <Icon.Plus style={{ width: 14, height: 14 }} /> Nueva pregunta
        </button>
      </div>

      {editing && (
        <div className="fade-in" style={{ marginBottom: 24, borderRadius: 16, border: "1px solid var(--base-700)", background: "rgba(18,22,35,.6)", padding: 20, maxWidth: 560 }}>
          <h2 style={{ marginTop: 0, fontSize: 15, fontWeight: 600 }}>{editing === "new" ? "Nueva pregunta" : "Editar pregunta"}</h2>
          <div style={{ marginBottom: 12 }}><label style={labelStyle}>Pregunta</label><input style={inputStyle} value={form.question} onChange={(e) => setForm({ ...form, question: e.target.value })} /></div>
          <div style={{ marginBottom: 12 }}><label style={labelStyle}>Respuesta</label><textarea rows={3} style={{ ...inputStyle, resize: "vertical", fontFamily: "inherit" }} value={form.answer} onChange={(e) => setForm({ ...form, answer: e.target.value })} /></div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={save} disabled={!form.question.trim() || !form.answer.trim()} style={{ borderRadius: 999, border: "none", background: "var(--success-500)", color: "#fff", padding: "8px 16px", fontSize: 13, fontWeight: 600, opacity: (!form.question.trim() || !form.answer.trim()) ? 0.5 : 1 }}>Guardar</button>
            <button onClick={cancel} style={{ borderRadius: 999, border: "1px solid var(--base-700)", background: "transparent", color: "#9ca3af", padding: "8px 16px", fontSize: 13 }}>Cancelar</button>
          </div>
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {(db.faqs || []).map((f) => (
          <div key={f.id} style={{ borderRadius: 12, border: "1px solid var(--base-700)", background: "rgba(18,22,35,.6)", padding: 14 }}>
            <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 10 }}>
              <div>
                <p style={{ margin: "0 0 4px", fontSize: 13, fontWeight: 600 }}>{f.question}</p>
                <p style={{ margin: 0, fontSize: 12, color: "#9ca3af" }}>{f.answer}</p>
              </div>
              <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
                <button onClick={() => startEdit(f)} style={{ background: "none", border: "none", color: "var(--accent-400)", padding: 4 }}><Icon.Edit style={{ width: 14, height: 14 }} /></button>
                <button onClick={() => remove(f.id)} style={{ background: "none", border: "none", color: "var(--signal-400)", padding: 4 }}><Icon.Trash style={{ width: 14, height: 14 }} /></button>
              </div>
            </div>
          </div>
        ))}
        {(db.faqs || []).length === 0 && <p style={{ color: "#6b7280", fontSize: 13 }}>Sin preguntas todavía.</p>}
      </div>
    </div>
  );
}

function SheetSyncButton({ label, onSync }) {
  const [status, setStatus] = useState(null); // { ok, message/count }
  const [loading, setLoading] = useState(false);

  async function handleSync() {
    setLoading(true);
    setStatus(null);
    const result = await onSync();
    setLoading(false);
    setStatus(result);
  }

  return (
    <div style={{ marginTop: 4 }}>
      <button type="button" onClick={handleSync} disabled={loading}
        style={{ display: "flex", alignItems: "center", gap: 8, borderRadius: 999, border: "1px solid var(--base-700)", background: "transparent", color: "var(--accent-400)", padding: "8px 16px", fontSize: 13, opacity: loading ? 0.6 : 1 }}>
        {loading && <Icon.Loader className="spin" style={{ width: 14, height: 14 }} />}
        {label}
      </button>
      {status && (
        <p style={{ margin: "6px 0 0", fontSize: 12, color: status.ok ? "var(--success-500)" : "var(--signal-400)" }}>
          {status.ok ? `✓ ${status.count} fila(s) importada(s) desde el Sheet.` : `✕ ${status.message}`}
        </p>
      )}
    </div>
  );
}

/* ============================================================
   APP ROOT — router simple con hash (#/  y  #/admin)
   ============================================================ */
/* Red de seguridad: si CUALQUIER parte de la app truena al renderizar,
   en vez de dejar la pantalla en negro (React desmonta todo y no queda
   nada visible salvo el fondo oscuro del body), mostramos el error real
   y un botón para recargar. Esto nunca debería "ocultar" el bug, solo
   evita el silencio total y nos dice exactamente qué pasó. */
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("Error capturado por ErrorBoundary:", error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", padding: 24, textAlign: "center" }}>
          <div style={{ maxWidth: 480 }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>⚠️</div>
            <h1 style={{ fontSize: 18, margin: "0 0 8px" }}>Ocurrió un error inesperado</h1>
            <p style={{ color: "#9ca3af", fontSize: 13, marginBottom: 16 }}>
              La app encontró un problema y se detuvo para no mostrar datos corruptos. Detalle técnico:
            </p>
            <pre style={{ textAlign: "left", background: "var(--base-900)", border: "1px solid var(--base-700)", borderRadius: 8, padding: 12, fontSize: 11, overflowX: "auto", color: "var(--signal-400)" }}>
              {String(this.state.error && (this.state.error.stack || this.state.error.message || this.state.error))}
            </pre>
            <button onClick={() => window.location.reload()}
              style={{ marginTop: 16, background: "var(--accent-500)", color: "#000", border: "none", borderRadius: 8, padding: "10px 20px", fontWeight: 700, cursor: "pointer" }}>
              Recargar página
            </button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function App() {
  const [db, setDb] = useState(loadDB);

  useEffect(() => {

  }, []);

  // Escucha en tiempo real: si tú (u otra persona) cambia algo desde
  // cualquier dispositivo, todos los que tengan la tienda abierta
  // reciben la actualización automáticamente, sin recargar la página.
  useEffect(() => {
    const unsubscribe = subscribeToCloud((freshDb) => setDb(freshDb));
    return unsubscribe;
  }, []);

  if (route.startsWith(ADMIN_ROUTE)) return <AdminShell db={db} setDb={setDb} />;
  return <StorePage db={db} setDb={setDb} />;
}

/* Responsive helpers vía JS (media queries simples sin build step) */
function applyResponsiveStyles() {
  const styleTag = document.createElement("style");
  styleTag.textContent = `
    @media (min-width: 768px) {
      .desktop-search { display: block !important; }
      .desktop-wa-wrap { display: flex !important; }
      .mobile-panel { display: none !important; }
      .mobile-only-cart { display: none !important; }
    }
    @media (min-width: 1024px) {
      .desktop-nav { display: flex !important; }
    }
    @media (max-width: 767px) {
      .mobile-toggle { display: block !important; }
    }
    @media (min-width: 768px) {
      .mobile-toggle { display: none !important; }
    }
    @media (min-width: 640px) {
      .products-grid { grid-template-columns: repeat(2,1fr) !important; }
    }
    @media (min-width: 1024px) {
      .products-grid { grid-template-columns: repeat(3,1fr) !important; }
    }
    @media (min-width: 1280px) {
      .products-grid { grid-template-columns: repeat(4,1fr) !important; }
    }
  `;
  document.head.appendChild(styleTag);
}
applyResponsiveStyles();

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
