/* Red de seguridad global: si algo truena ANTES de que React/Firebase
   terminen de cargar (ej. un script bloqueado, un error de red, etc.),
   esto muestra el error real en vez de dejar la pantalla en negro sin
   ninguna pista de qué pasó. */
window.addEventListener("error", function (e) {
  showFatalErrorBanner(e.error ? (e.error.stack || e.error.message) : e.message);
});
window.addEventListener("unhandledrejection", function (e) {
  showFatalErrorBanner(e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : "Error desconocido");
});
function showFatalErrorBanner(detail) {
  if (document.getElementById("fatal-error-banner")) return;
  var root = document.getElementById("root");
  if (root && root.children.length > 0) return; // React ya montó algo, no interferir
  var div = document.createElement("div");
  div.id = "fatal-error-banner";
  div.style.cssText = "position:fixed;inset:0;background:#05060a;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;font-family:sans-serif;z-index:99999;";
  div.innerHTML = '<div style="max-width:480px;text-align:center;">' +
    '<div style="font-size:40px;margin-bottom:12px;">⚠️</div>' +
    '<h1 style="font-size:18px;margin:0 0 8px;">La tienda no pudo cargar</h1>' +
    '<p style="color:#9ca3af;font-size:13px;margin-bottom:16px;">Detalle técnico:</p>' +
    '<pre style="text-align:left;background:#121623;border:1px solid #1a1f2e;border-radius:8px;padding:12px;font-size:11px;overflow-x:auto;color:#ff5470;white-space:pre-wrap;word-break:break-word;">' +
    String(detail || "").replace(/</g, "&lt;") + '</pre>' +
    '<button onclick="location.reload()" style="margin-top:16px;background:#22b8ff;color:#000;border:none;border-radius:8px;padding:10px 20px;font-weight:700;cursor:pointer;">Recargar página</button>' +
    '</div>';
  document.body.appendChild(div);
}
</script>

/* Firestore rechaza cualquier campo con valor "undefined" (lanza
   FirebaseError: "Unsupported field value: undefined"). JSON.stringify
   (usado para localStorage) en cambio los borra sin quejarse, así que
   sin esto un dato guardado bien en local podía tronar al sincronizar
   con la nube. Esta función reemplaza recursivamente undefined -> null
   antes de cualquier escritura a Firestore. */
function sanitizeForFirestore(value) {
  if (value === undefined) return null;
  if (Array.isArray(value)) return value.map(sanitizeForFirestore);
  if (value && typeof value === "object" && !(value instanceof Date)) {
    const out = {};
    Object.keys(value).forEach((k) => { out[k] = sanitizeForFirestore(value[k]); });
    return out;
  }
  return value;
}

function getCloudDocRef() {

   (tú desde el admin, u otro dispositivo) modifica los datos, este
   callback se dispara al instante con la versión más nueva. */
function subscribeToCloud(onData) {
  if (!cloudSyncEnabled || !firestoreDB) return () => {};
  return getCloudDocRef().onSnapshot(
    (snap) => {
      if (snap.exists) {
        const data = migrateDB(snap.data());
        localStorage.setItem(DB_KEY, JSON.stringify(data));
        onData(data);
      } else {
        // Primera vez: no existe el documento en la nube todavía,
        // así que lo creamos con lo que haya local (o el seed).
        const initial = migrateDB(loadLocalOnly());
        getCloudDocRef().set(sanitizeForFirestore(initial)).catch((e) => console.error("Error creando doc inicial:", e));
      }
    },
    (err) => console.error("Error escuchando Firestore:", err)
  );
}

/* Rellena con valores por defecto cualquier campo/colección nueva que no
   exista todavía en una base de datos guardada con una versión anterior de
   la tienda, para que nunca se rompa al cargar datos "viejos". */
function migrateDB(db) {
  if (!db) return db;
  const productsArr = Array.isArray(db.products) ? db.products : [];
  return {
    ...db,
    products: productsArr.map(migrateProduct).map((p) => ({ license_keys: [], ...p })),
    categories: (db.categories || []).map((c) => ({ icon: "", ...c })),
    orders: db.orders || [],

      ...DEFAULT_SETTINGS,
      ...db.settings,
      announcement: { ...DEFAULT_SETTINGS.announcement, ...(db.settings && db.settings.announcement) },
    },
  };
}

/* Parser CSV simple (soporta campos con comas y saltos de línea entre
   comillas), sin depender de ninguna librería externa. */
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r') { /* ignorar */ }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter((r) => r.some((v) => (v || "").trim() !== ""));
}

function slugify(s) {
  return String(s || "").toLowerCase().trim()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-").replace(/(^-+|-+$)/g, "");
}

function csvBool(v, def = true) {
  const s = String(v || "").trim().toLowerCase();
  if (!s) return def;
  return !["no", "false", "0", "inactivo", "inactive"].includes(s);
}

/* Convierte las filas del CSV (con encabezados) en productos + categorías,
   creando automáticamente las categorías nuevas que aparezcan en la hoja. */
function rowsToProducts(rows, existingCategories) {
  if (rows.length < 2) return { products: [], categories: existingCategories };
  const header = rows[0].map((h) => h.trim().toLowerCase());
  const idx = {};
  header.forEach((h, i) => { if (idx[h] === undefined) idx[h] = i; });
  const get = (r, ...keys) => {
    for (const k of keys) { if (idx[k] !== undefined && r[idx[k]] != null) return String(r[idx[k]]).trim(); }
    return "";
  };
  const categories = existingCategories.map((c) => ({ ...c }));
  const products = rows.slice(1).map((r) => {
    const title = get(r, "title", "titulo", "título", "nombre");
    if (!title) return null;

    const categoryName = get(r, "category", "categoria", "categoría");
    let category_id = null;
    if (categoryName) {
      const slug = slugify(categoryName);
      let cat = categories.find((c) => c.slug === slug);
      if (!cat) { cat = { id: uid(), name: categoryName, slug, icon: "" }; categories.push(cat); }
      category_id = cat.id;
    }

    const plans = [];
    for (let n = 1; n <= 4; n++) {
      const label = get(r, `plan${n}_label`, `plan${n} label`);
      const priceRaw = get(r, `plan${n}_price`, `plan${n} price`);
      if (label && priceRaw) plans.push(plan(label, parseFloat(priceRaw.replace(",", ".")) || 0));
    }
    if (plans.length === 0) {
      const priceRaw = get(r, "price", "precio");
      plans.push(plan(get(r, "duration", "duracion", "duración") || "1 mes", parseFloat((priceRaw || "0").replace(",", ".")) || 0));
    }

    const featuresRaw = get(r, "features", "caracteristicas", "características");

    return {
      id: get(r, "id") || `sheet-${slugify(title)}`,
      title,
      slug: slugify(title),
      category_id,
      description: get(r, "description", "descripcion", "descripción"),
      image_url: get(r, "image_url", "imagen", "image"),
      stock: parseInt(get(r, "stock") || "0", 10) || 0,
      is_active: csvBool(get(r, "active", "activo")),
      features: featuresRaw ? featuresRaw.split("|").map((s) => s.trim()).filter(Boolean) : [],
      plans,
      license_keys: [],
    };
  }).filter(Boolean);

  return { products, categories };
}

/* Descarga el CSV publicado y reemplaza el catálogo (productos +
   categorías) en la base de datos, conservando las claves/licencias que
   ya tuviera cargadas cada producto (para no perder inventario). */
async function syncCatalogFromSheet(csvUrl, setDb) {
  if (!csvUrl || !csvUrl.trim()) return { ok: false, message: "No configuraste la URL del CSV del catálogo." };
  let text;
  try {
    const res = await fetch(csvUrl, { cache: "no-store" });
    if (!res.ok) throw new Error("No se pudo leer el Google Sheet. Revisa que esté publicado a la web como CSV.");
    text = await res.text();
  } catch (e) {
    return { ok: false, message: e.message || "Error de red al leer el Google Sheet." };
  }

  return new Promise((resolve) => {
    setDb((prev) => {
      let result;
      try {
        const rows = parseCSV(text);
        const { products, categories } = rowsToProducts(rows, prev.categories);
        const merged = products.map((p) => {
          const old = prev.products.find((op) => op.id === p.id);
          return old ? { ...p, license_keys: old.license_keys || [] } : p;
        });
        const next = { ...prev, products: merged, categories };
        saveDB(next);
        result = { ok: true, count: merged.length };
        resolve(result);
        return next;
      } catch (e) {
        resolve({ ok: false, message: "El CSV no tiene el formato esperado." });
        return prev;
      }
    });
  });
}

/* Envía datos (pedidos o reseñas) al webhook de Apps Script, que los
   reparte en la pestaña correspondiente de tu Sheet según "type".
   Es "fire and forget": si falla (o no está configurado), no interrumpe
   nada en la tienda — todo sigue guardándose en Firestore igual. */
function sendToSheet(webhookUrl, type, items) {
  if (!webhookUrl || !webhookUrl.trim()) return;
  items.forEach((item) => {
    fetch(webhookUrl, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ type, ...item }),
    }).catch((e) => console.warn("No se pudo enviar a Google Sheets:", e));
  });
}

/* Descarga el CSV de cupones publicado y reemplaza SOLO los cupones que
   vinieron del Sheet (id "sheet-<código>"), sin tocar los que hayas
   creado a mano desde el Admin. Columnas esperadas: code | type | value
   | active  (type: "percent"/"porcentaje" o "fixed"/"fijo"). */
async function syncCouponsFromSheet(csvUrl, setDb) {
  if (!csvUrl || !csvUrl.trim()) return { ok: false, message: "No configuraste la URL del CSV de cupones." };
  let text;
  try {
    const res = await fetch(csvUrl, { cache: "no-store" });
    if (!res.ok) throw new Error("No se pudo leer el Google Sheet de cupones. Revisa que esté publicado a la web como CSV.");
    text = await res.text();
  } catch (e) {
    return { ok: false, message: e.message || "Error de red al leer el Google Sheet de cupones." };
  }

  return new Promise((resolve) => {
    setDb((prev) => {
      try {
        const rows = parseCSV(text);
        if (rows.length < 2) { resolve({ ok: true, count: 0 }); return prev; }
        const header = rows[0].map((h) => h.trim().toLowerCase());
        const idx = {};
        header.forEach((h, i) => { if (idx[h] === undefined) idx[h] = i; });
        const get = (r, ...keys) => {
          for (const k of keys) { if (idx[k] !== undefined && r[idx[k]] != null) return String(r[idx[k]]).trim(); }
          return "";
        };
        const sheetCoupons = rows.slice(1).map((r) => {
          const code = get(r, "code", "codigo", "código").toUpperCase();
          if (!code) return null;
          const typeRaw = get(r, "type", "tipo").toLowerCase();
          const type = ["fixed", "fijo", "monto"].includes(typeRaw) ? "fixed" : "percent";
          const value = parseFloat((get(r, "value", "valor") || "0").replace(",", ".")) || 0;
          return { id: `sheet-${code}`, code, type, value, active: csvBool(get(r, "active", "activo")) };
        }).filter(Boolean);

        const next = { ...prev, coupons: [...(prev.coupons || []).filter((c) => !String(c.id).startsWith("sheet-")), ...sheetCoupons] };
        saveDB(next);
        resolve({ ok: true, count: sheetCoupons.length });
        return next;
      } catch (e) {
        resolve({ ok: false, message: "El CSV de cupones no tiene el formato esperado." });
        return prev;
      }
    });
  });
}

/* ============================================================
   DROPDOWN PROPIO (reemplaza al <select> nativo)
   ------------------------------------------------------------
   En Windows, Chrome a veces renderiza el popup de un <select>
   con el tema del sistema operativo e ignora por completo el CSS
   de la página (aunque tenga color-scheme:dark y estilos en las
   <option>) — el menú sale negro sobre negro, ilegible. Este
   componente dibuja el menú nosotros mismos con divs normales,
   así siempre se ve igual sin importar el navegador/SO.
   ============================================================ */
function Dropdown({ value, onChange, options, buttonStyle }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    function onDocClick(e) {
      if (ref.current && !ref.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener("mousedown", onDocClick);
    return () => document.removeEventListener("mousedown", onDocClick);
  }, []);

  const current = options.find((o) => o.value === value);

  return (
    <div ref={ref} style={{ position: "relative", display: "inline-block", width: buttonStyle && buttonStyle.width ? buttonStyle.width : "auto" }}>
      <button type="button" onClick={() => setOpen((o) => !o)}
        style={{
          display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8,
          width: "100%", borderRadius: 8, border: "1px solid var(--base-700)",
          background: "var(--base-800)", color: "#fff", padding: "8px 12px", fontSize: 13,
          fontFamily: "inherit", cursor: "pointer", textAlign: "left",
          ...buttonStyle,
        }}>
        <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{current ? current.label : ""}</span>
        <Icon.ChevronDown style={{ width: 13, height: 13, flexShrink: 0, color: "#9ca3af", transform: open ? "rotate(180deg)" : "none", transition: "transform .15s" }} />
      </button>
      {open && (
        <div style={{
          position: "absolute", top: "calc(100% + 4px)", left: 0, minWidth: "100%", zIndex: 60,
          borderRadius: 10, border: "1px solid var(--base-700)", background: "#161b29",
          boxShadow: "0 12px 28px rgba(0,0,0,.55)", overflow: "hidden", maxHeight: 260, overflowY: "auto",
        }}>
          {options.map((o) => (
            <div key={o.value}
              onClick={() => { onChange(o.value); setOpen(false); }}
              style={{
                padding: "8px 12px", fontSize: 13, color: "#fff", cursor: "pointer", whiteSpace: "nowrap",
                background: o.value === value ? "var(--base-700)" : "transparent",
              }}
              onMouseEnter={(e) => { e.currentTarget.style.background = "var(--base-700)"; }}
              onMouseLeave={(e) => { e.currentTarget.style.background = o.value === value ? "var(--base-700)" : "transparent"; }}>
              {o.label}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* Estrellas de calificación (solo lectura o interactivas). */
function StarRating({ value, onChange, size = 16 }) {
  const stars = [1, 2, 3, 4, 5];
  return (
    <div style={{ display: "flex", gap: 2 }}>
      {stars.map((n) => {
        const filled = n <= Math.round(value);
        const StarIcon = filled ? Icon.StarFilled : Icon.Star;
        return (
          <span key={n} onClick={onChange ? () => onChange(n) : undefined}
            style={{ color: filled ? "#fbbf24" : "#4b5563", cursor: onChange ? "pointer" : "default", display: "flex" }}>
            <StarIcon style={{ width: size, height: size }} />
          </span>
        );
      })}
    </div>
  );
}

function ProductCard({ product, onSelect, onQuickAdd }) {
  const inStock = product.stock > 0;
  const plans = product.plans || [];
  const minPlan = plans.reduce((min, pl) => (!min || pl.price < min.price ? pl : min), null);
  const singlePlan = plans.length === 1 ? plans[0] : null;

  function handleButtonClick() {
    if (singlePlan) {
      onQuickAdd(product, singlePlan.id, 1);
    } else {
      onSelect(product);
    }
  }

  return (
    <div className="card-hover" style={{ position: "relative", overflow: "hidden", borderRadius: 20, border: "1px solid var(--base-700)", background: "rgba(18,22,35,.6)", boxShadow: "0 10px 25px rgba(0,0,0,.3)" }}>
      <div onClick={() => onSelect(product)} style={{ position: "relative", height: 160, display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden", background: "var(--base-700)", cursor: "pointer" }}>
        {product.image_url ? (
          <img src={product.image_url} alt={product.title} style={{ width: "100%", height: "100%", objectFit: "cover" }} onError={(e) => { e.target.style.display = "none"; }} />
        ) : (
          <Icon.ImageOff style={{ width: 32, height: 32, color: "var(--base-600)" }} />
        )}
        <span style={{ position: "absolute", right: 8, top: 8, borderRadius: 999, padding: "4px 10px", fontSize: 12, fontWeight: 500, background: inStock ? "rgba(34,197,94,.2)" : "rgba(255,45,77,.2)", color: inStock ? "var(--success-500)" : "var(--signal-400)" }}>
          {inStock ? "Disponible" : "Agotado"}
        </span>
      </div>
      <div style={{ padding: 16 }}>
        <h3 onClick={() => onSelect(product)} className="line-clamp-1" style={{ margin: "0 0 4px", fontSize: 16, fontWeight: 600, cursor: "pointer" }}>{product.title}</h3>
        {singlePlan ? (
          <p style={{ margin: "0 0 12px", fontSize: 12, color: "#9ca3af" }}>{singlePlan.duration_label}</p>
        ) : (
          <div style={{ margin: "0 0 12px", display: "flex", flexWrap: "wrap", gap: 6 }}>
            {plans.map((pl) => (
              <span key={pl.id} style={{ borderRadius: 999, padding: "2px 8px", fontSize: 11, background: "var(--base-700)", color: "#9ca3af" }}>{pl.duration_label}</span>
            ))}
          </div>
        )}
        <ul style={{ listStyle: "none", margin: "0 0 16px", padding: 0, display: "flex", flexDirection: "column", gap: 4 }}>
          {product.features.slice(0, 3).map((f, i) => (
            <li key={i} style={{ display: "flex", alignItems: "flex-start", gap: 6, fontSize: 12, color: "#d1d5db" }}>
              <Icon.Check style={{ width: 14, height: 14, marginTop: 1, flexShrink: 0, color: "var(--accent-400)" }} />
              <span className="line-clamp-1">{f}</span>
            </li>
          ))}
        </ul>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <span style={{ fontSize: 18, fontWeight: 700 }}>
            {singlePlan ? `S/ ${singlePlan.price.toFixed(2)}` : `Desde S/ ${(minPlan?.price ?? 0).toFixed(2)}`}
          </span>
          <button disabled={!inStock} onClick={handleButtonClick} className={inStock ? "neon-red-hover" : ""}
            style={{ borderRadius: 999, padding: "8px 16px", fontSize: 14, fontWeight: 500, border: "none", transition: "all .15s",
              background: inStock ? "var(--signal-500)" : "var(--base-700)", color: inStock ? "#fff" : "#6b7280", cursor: inStock ? "pointer" : "not-allowed" }}>
            {inStock ? (singlePlan ? "Agregar" : "Ver opciones") : "Agotado"}
          </button>
        </div>
      </div>
    </div>

/* ============================================================
   CATALOG GRID
   ============================================================ */
function CatalogGrid({ products, onSelect, onQuickAdd }) {
  const [duration, setDuration] = useState("Todos");
  const [maxPrice, setMaxPrice] = useState(200);
  const [showFilters, setShowFilters] = useState(false);

  // Las opciones de duración se arman con las que el admin realmente configuró
  // en los productos, así el filtro nunca muestra duraciones que nadie ofrece.
  const availableDurations = useMemo(() => {
    const set = new Set();
    products.forEach((p) => (p.plans || []).forEach((pl) => set.add(pl.duration_label)));
    return ["Todos", ...Array.from(set)];
  }, [products]);

  const filtered = useMemo(() => products.filter((p) => {
    const plans = p.plans || [];
    const matchesDuration = duration === "Todos" || plans.some((pl) => pl.duration_label === duration);
    const matchesPrice = plans.some((pl) => pl.price <= maxPrice);
    return matchesDuration && matchesPrice;
  }), [products, duration, maxPrice]);

  const chipStyle = (active) => ({
    borderRadius: 999, padding: "6px 12px", fontSize: 12, border: "none",
    background: active ? "rgba(34,184,255,.2)" : "var(--base-700)",
    color: active ? "var(--accent-400)" : "#9ca3af",
  });

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
        <p style={{ fontSize: 14, color: "#9ca3af", margin: 0 }}>{filtered.length} productos encontrados</p>
        <button onClick={() => setShowFilters((v) => !v)} style={{ display: "flex", alignItems: "center", gap: 8, borderRadius: 999, border: "1px solid var(--base-700)", background: "transparent", padding: "6px 12px", fontSize: 14, color: "#d1d5db" }}>
          <Icon.Sliders style={{ width: 16, height: 16 }} /> Filtros
        </button>
      </div>

      {showFilters && (
        <div className="fade-in" style={{ marginBottom: 24, display: "grid", gridTemplateColumns: "1fr", gap: 16, borderRadius: 12, border: "1px solid var(--base-700)", background: "rgba(18,22,35,.6)", padding: 16 }}>
          <div>
            <label style={{ display: "block", marginBottom: 8, fontSize: 12, fontWeight: 500, color: "#9ca3af" }}>Duración</label>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
              {availableDurations.map((d) => <button key={d} onClick={() => setDuration(d)} style={chipStyle(duration === d)}>{d}</button>)}
            </div>
          </div>
          <div>
            <label style={{ display: "block", marginBottom: 8, fontSize: 12, fontWeight: 500, color: "#9ca3af" }}>Precio máximo: S/ {maxPrice}</label>
            <input type="range" min="10" max="200" step="5" value={maxPrice} onChange={(e) => setMaxPrice(Number(e.target.value))} style={{ width: "100%", accentColor: "var(--accent-500)" }} />
          </div>
        </div>
      )}

      <div className="products-grid" style={{ display: "grid", gridTemplateColumns: "repeat(1,1fr)", gap: 20 }}>
        {filtered.map((p) => <ProductCard key={p.id} product={p} onSelect={onSelect} onQuickAdd={onQuickAdd} />)}
      </div>

      {filtered.length === 0 && <div style={{ padding: "64px 0", textAlign: "center", color: "#6b7280" }}>No se encontraron productos con estos filtros.</div>}
    </div>
  );
}

/* ============================================================
   MODAL DE DETALLE DE PRODUCTO (+ productos similares)
   ============================================================ */
function ReviewsSection({ product, reviews, onAddReview }) {
  const [name, setName] = useState("");
  const [rating, setRating] = useState(5);
  const [comment, setComment] = useState("");
  const [sent, setSent] = useState(false);
  const [showForm, setShowForm] = useState(false);

  const approved = reviews.filter((r) => r.product_id === product.id && r.approved);
  const avg = approved.length ? approved.reduce((s, r) => s + r.rating, 0) / approved.length : 0;

  function submit() {
    if (!name.trim() || !comment.trim()) return;
    onAddReview({ id: uid(), product_id: product.id, name: name.trim(), rating, comment: comment.trim(), approved: false, created_at: new Date().toISOString() });
    setName(""); setComment(""); setRating(5); setShowForm(false); setSent(true);
    setTimeout(() => setSent(false), 3000);
  }

  const inputStyle = { width: "100%", borderRadius: 8, border: "1px solid var(--base-700)", background: "var(--base-800)", padding: "8px 12px", fontSize: 13, color: "#fff", colorScheme: "dark" };

  return (
    <div style={{ marginTop: 28, borderTop: "1px solid var(--base-700)", paddingTop: 20 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <h3 style={{ margin: 0, fontSize: 14, fontWeight: 600, color: "#d1d5db" }}>Reseñas</h3>
          {approved.length > 0 && (
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <StarRating value={avg} size={14} />
              <span style={{ fontSize: 12, color: "#9ca3af" }}>{avg.toFixed(1)} ({approved.length})</span>
            </div>
          )}
        </div>
        {!showForm && <button onClick={() => setShowForm(true)} style={{ background: "none", border: "1px solid var(--base-700)", color: "var(--accent-400)", borderRadius: 999, padding: "4px 12px", fontSize: 12 }}>Escribir reseña</button>}
      </div>

      {showForm && (
        <div className="fade-in" style={{ marginBottom: 16, borderRadius: 12, border: "1px solid var(--base-700)", background: "rgba(18,22,35,.6)", padding: 12, display: "flex", flexDirection: "column", gap: 8 }}>
          <StarRating value={rating} onChange={setRating} size={20} />
          <input style={inputStyle} placeholder="Tu nombre" value={name} onChange={(e) => setName(e.target.value)} />
          <textarea rows={2} style={{ ...inputStyle, resize: "vertical", fontFamily: "inherit" }} placeholder="Cuéntanos tu experiencia..." value={comment} onChange={(e) => setComment(e.target.value)} />
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={submit} disabled={!name.trim() || !comment.trim()} style={{ borderRadius: 999, border: "none", background: "var(--success-500)", color: "#fff", padding: "6px 14px", fontSize: 12, fontWeight: 600, opacity: (!name.trim() || !comment.trim()) ? 0.5 : 1 }}>Enviar</button>
            <button onClick={() => setShowForm(false)} style={{ borderRadius: 999, border: "1px solid var(--base-700)", background: "transparent", color: "#9ca3af", padding: "6px 14px", fontSize: 12 }}>Cancelar</button>
          </div>
        </div>
      )}
      {sent && <p style={{ fontSize: 12, color: "var(--success-500)", marginBottom: 12 }}>✓ ¡Gracias! Tu reseña se publicará luego de ser revisada.</p>}

      {approved.length === 0 ? (
        <p style={{ fontSize: 13, color: "#6b7280" }}>Aún no hay reseñas para este producto. ¡Sé el primero en opinar!</p>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {approved.map((r) => (
            <div key={r.id} style={{ borderRadius: 10, border: "1px solid var(--base-700)", padding: 10 }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 4 }}>
                <span style={{ fontSize: 13, fontWeight: 600 }}>{r.name}</span>
                <StarRating value={r.rating} size={12} />
              </div>
              <p style={{ margin: 0, fontSize: 12, color: "#d1d5db" }}>{r.comment}</p>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

                <button onClick={() => setQty((q) => Math.max(1, q - 1))} style={{ background: "none", border: "none", color: "#fff", padding: 4, borderRadius: 999 }}><Icon.Minus style={{ width: 14, height: 14 }} /></button>
                <span style={{ minWidth: 20, textAlign: "center", fontSize: 14, fontWeight: 600 }}>{qty}</span>
                <button onClick={() => setQty((q) => q + 1)} style={{ background: "none", border: "none", color: "#fff", padding: 4, borderRadius: 999 }}><Icon.Plus style={{ width: 14, height: 14 }} /></button>
              </div>
            </div>
            {selectedPlan && (
              <div style={{ marginLeft: "auto", textAlign: "right" }}>
                <p style={{ margin: 0, fontSize: 12, color: "#9ca3af" }}>Subtotal</p>
                <p style={{ margin: 0, fontSize: 20, fontWeight: 700 }}>S/ {(selectedPlan.price * qty).toFixed(2)}</p>
              </div>
            )}
          </div>

          <button onClick={handleAdd} disabled={!inStock || !selectedPlan}
            style={{ display: "flex", width: "100%", alignItems: "center", justifyContent: "center", gap: 8, borderRadius: 999,
              background: justAdded ? "var(--success-500)" : (inStock ? "var(--signal-500)" : "var(--base-700)"), padding: "12px", fontSize: 14, fontWeight: 600, color: inStock ? "#fff" : "#6b7280",
              border: "none", cursor: inStock ? "pointer" : "not-allowed", transition: "background .2s" }}>
            {justAdded ? <><Icon.Check style={{ width: 16, height: 16 }} /> Añadido al carrito</> : (inStock ? <><Icon.Cart style={{ width: 16, height: 16 }} /> Agregar al carrito</> : "Agotado")}
          </button>

          <ReviewsSection product={product} reviews={reviews || []} onAddReview={onAddReview} />

          {similar.length > 0 && (
            <div style={{ marginTop: 28 }}>
              <h3 style={{ margin: "0 0 12px", fontSize: 14, fontWeight: 600, color: "#d1d5db" }}>Productos similares</h3>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(2,1fr)", gap: 10 }}>
                {similar.map((sp) => {
                  const spPlan = (sp.plans || [])[0];
                  return (
                    <button key={sp.id} onClick={() => onSelectProduct(sp)} style={{ textAlign: "left", display: "flex", gap: 10, alignItems: "center", borderRadius: 12, border: "1px solid var(--base-700)", background: "rgba(18,22,35,.6)", padding: 8, cursor: "pointer" }}>
                      <div style={{ width: 48, height: 48, borderRadius: 8, overflow: "hidden", flexShrink: 0, background: "var(--base-700)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                        {sp.image_url ? <img src={sp.image_url} alt={sp.title} style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <Icon.ImageOff style={{ width: 16, height: 16, color: "var(--base-600)" }} />}
                      </div>
                      <div style={{ minWidth: 0 }}>
                        <p className="line-clamp-1" style={{ margin: 0, fontSize: 12, fontWeight: 600 }}>{sp.title}</p>
                        {spPlan && <p style={{ margin: 0, fontSize: 11, color: "#9ca3af" }}>S/ {spPlan.price.toFixed(2)}</p>}
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   CARRITO (varios productos) + CHECKOUT
   ============================================================ */
const PAYMENT_OPTIONS = [
  { value: "yape", label: "Yape", icon: Icon.Smartphone },
  { value: "transferencia", label: "Transferencia BCP / CCI", icon: Icon.Bank },
];

function CartModal({ cart, products, settings, coupons, onClose, onUpdateQty, onRemove, onCreateOrders, onCleared }) {
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [payment, setPayment] = useState("yape");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [couponInput, setCouponInput] = useState("");
  const [appliedCoupon, setAppliedCoupon] = useState(null);
  const [couponMsg, setCouponMsg] = useState(null);
  const [opCode, setOpCode] = useState("");
  const [proofFile, setProofFile] = useState(null);
  const [proofPreview, setProofPreview] = useState(null);
  const [uploadingProof, setUploadingProof] = useState(false);

  const lines = cart.map((item) => {
    const product = products.find((p) => p.id === item.product_id);
    const plan = product ? (product.plans || []).find((pl) => pl.id === item.plan_id) : null;
    return { ...item, product, plan };
  }).filter((l) => l.product && l.plan);

  const subtotal = lines.reduce((sum, l) => sum + l.plan.price * l.qty, 0);
  const discount = appliedCoupon
    ? (appliedCoupon.type === "percent" ? subtotal * (appliedCoupon.value / 100) : Math.min(appliedCoupon.value, subtotal))
    : 0;
  const total = Math.max(0, subtotal - discount);
  const paymentLabel = PAYMENT_OPTIONS.find((p) => p.value === payment)?.label ?? payment;

  const qrForPayment = payment === "yape" ? settings.yape_qr_url : settings.bank_qr_url;

  function applyCoupon() {
    const code = couponInput.trim().toUpperCase();
    if (!code) return;
    const found = (coupons || []).find((c) => c.code.trim().toUpperCase() === code && c.active);
    if (!found) {
      setAppliedCoupon(null);
      setCouponMsg({ ok: false, text: "Cupón no válido o inactivo." });
      return;
    }
    setAppliedCoupon(found);
    setCouponMsg({ ok: true, text: found.type === "percent" ? `✓ Cupón aplicado: -${found.value}%` : `✓ Cupón aplicado: -S/ ${found.value.toFixed(2)}` });
  }
  function removeCoupon() {
    setAppliedCoupon(null); setCouponInput(""); setCouponMsg(null);
  }

  function handleProofChange(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setProofFile(file);
    const reader = new FileReader();
    reader.onload = () => setProofPreview(reader.result);
    reader.readAsDataURL(file);
  }

  function handleConfirm() {
    if (lines.length === 0) return;
    if (!name.trim() || !phone.trim()) {
      setError("Por favor completa tu nombre y número de WhatsApp.");
      return;
    }
    if (!opCode.trim()) {
      setError("Ingresa el código de operación / referencia de tu pago (Yape o BCP).");
      return;
    }
    setError(null);
    setLoading(true);

    const proceed = (proofUrl) => {
      const orders = lines.map((l) => ({
        id: uid(), product_id: l.product.id, customer_name: name.trim(), customer_phone: phone.trim(),
        payment_method: payment, plan_duration_label: l.plan.duration_label, price_at_order: l.plan.price, qty: l.qty,
        status: "pendiente", notes: null, created_at: new Date().toISOString(),
        coupon_code: appliedCoupon ? appliedCoupon.code : null,
        discount_amount: appliedCoupon && subtotal > 0 ? discount * (l.plan.price * l.qty / subtotal) : 0,
        operation_code: opCode.trim(),
        payment_proof_url: proofUrl || null,
        delivered_key: null,
      }));
      onCreateOrders(orders);
      setLoading(false);

      const itemLines = lines.map((l) => `• ${l.product.title} (${l.plan.duration_label}) x${l.qty} — S/ ${(l.plan.price * l.qty).toFixed(2)}`).join("\n");
      const messageParts = [
        `Hola, deseo adquirir lo siguiente:`,
        itemLines,
      ];
      if (appliedCoupon) messageParts.push(`Cupón aplicado: ${appliedCoupon.code} (-S/ ${discount.toFixed(2)})`);
      messageParts.push(`Total: S/ ${total.toFixed(2)}`, `Método de pago: ${paymentLabel}.`, `Código de operación: ${opCode.trim()}`, `Mi nombre es ${name.trim()} y mi número es ${phone.trim()}.`);
      if (proofUrl && /^https?:\/\//.test(proofUrl)) messageParts.push(`Comprobante de pago: ${proofUrl}`);
      else if (proofUrl) messageParts.push(`Ya adjunté mi comprobante de pago (lo verás en el panel).`);
      const message = messageParts.join("\n");
      const waUrl = `https://wa.me/${settings.whatsapp_number}?text=${encodeURIComponent(message)}`;
      window.open(waUrl, "_blank");
      onCleared();
      onClose();
    };

    if (proofFile) {
      setUploadingProof(true);
      uploadImageSmart(proofFile, "comprobantes")
        .then((url) => { setUploadingProof(false); proceed(url); })
        .catch(() => { setUploadingProof(false); proceed(null); });
    } else {
      setTimeout(() => proceed(null), 300);
    }
  }

  return (
    <div className="fade-in" onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,.7)", backdropFilter: "blur(4px)", padding: 16 }}>
      <div className="slide-up" onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxWidth: 480, borderRadius: 20, border: "1px solid var(--base-700)", background: "var(--base-900)", padding: 24, maxHeight: "90vh", overflowY: "auto" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
          <h2 style={{ margin: 0, fontSize: 18, fontWeight: 600, display: "flex", alignItems: "center", gap: 8 }}><Icon.Cart style={{ width: 20, height: 20 }} /> Tu carrito</h2>
          <button onClick={onClose} style={{ background: "none", border: "none", color: "#9ca3af", padding: 4, borderRadius: 999 }}><Icon.X style={{ width: 20, height: 20 }} /></button>
        </div>

        {lines.length === 0 ? (
          <p style={{ textAlign: "center", padding: "32px 0", color: "#6b7280", fontSize: 14 }}>Tu carrito está vacío. Agrega productos desde la tienda.</p>
        ) : (
          <>
            <div style={{ display: "flex", flexDirection: "column", gap: 12, marginBottom: 16 }}>
              {lines.map((l) => (
                <div key={l.id} style={{ display: "flex", gap: 10, alignItems: "center", borderRadius: 12, border: "1px solid var(--base-700)", padding: 10 }}>
                  <div style={{ width: 44, height: 44, borderRadius: 8, overflow: "hidden", flexShrink: 0, background: "var(--base-700)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                    {l.product.image_url ? <img src={l.product.image_url} alt={l.product.title} style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <Icon.ImageOff style={{ width: 16, height: 16, color: "var(--base-600)" }} />}
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <p className="line-clamp-1" style={{ margin: 0, fontSize: 13, fontWeight: 600 }}>{l.product.title}</p>
                    <p style={{ margin: 0, fontSize: 11, color: "#9ca3af" }}>{l.plan.duration_label} · S/ {l.plan.price.toFixed(2)}</p>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 6, border: "1px solid var(--base-700)", borderRadius: 999, padding: "2px 6px" }}>
                    <button onClick={() => onUpdateQty(l.id, Math.max(1, l.qty - 1))} style={{ background: "none", border: "none", color: "#fff", padding: 2 }}><Icon.Minus style={{ width: 12, height: 12 }} /></button>
                    <span style={{ minWidth: 16, textAlign: "center", fontSize: 12 }}>{l.qty}</span>
                    <button onClick={() => onUpdateQty(l.id, l.qty + 1)} style={{ background: "none", border: "none", color: "#fff", padding: 2 }}><Icon.Plus style={{ width: 12, height: 12 }} /></button>
                  </div>
                  <button onClick={() => onRemove(l.id)} style={{ background: "none", border: "none", color: "var(--signal-400)", padding: 4 }}><Icon.Trash style={{ width: 15, height: 15 }} /></button>
                </div>
              ))}
            </div>

            <div style={{ marginBottom: 16 }}>
              <label style={{ display: "block", marginBottom: 6, fontSize: 12, fontWeight: 500, color: "#9ca3af" }}>Código de cupón</label>
              {appliedCoupon ? (
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", borderRadius: 8, border: "1px solid var(--success-500)", background: "rgba(34,197,94,.1)", padding: "8px 12px" }}>
                  <span style={{ fontSize: 13, color: "var(--success-500)", display: "flex", alignItems: "center", gap: 6 }}><Icon.Tag style={{ width: 14, height: 14 }} />{appliedCoupon.code}</span>
                  <button onClick={removeCoupon} style={{ background: "none", border: "none", color: "#9ca3af", fontSize: 12 }}>Quitar</button>
                </div>
              ) : (
                <div style={{ display: "flex", gap: 8 }}>
                  <input value={couponInput} onChange={(e) => setCouponInput(e.target.value)} placeholder="Ej: BIENVENIDA10"
                    style={{ flex: 1, borderRadius: 8, border: "1px solid var(--base-700)", background: "var(--base-800)", padding: "8px 12px", fontSize: 13, color: "#fff", textTransform: "uppercase" }} />
                  <button onClick={applyCoupon} style={{ borderRadius: 8, border: "1px solid var(--base-700)", background: "transparent", color: "var(--accent-400)", padding: "0 14px", fontSize: 13 }}>Aplicar</button>
                </div>
              )}
              {couponMsg && <p style={{ margin: "6px 0 0", fontSize: 11, color: couponMsg.ok ? "var(--success-500)" : "var(--signal-400)" }}>{couponMsg.text}</p>}
            </div>

            <div style={{ marginBottom: 16, fontSize: 13, color: "#d1d5db" }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}><span>Subtotal</span><span>S/ {subtotal.toFixed(2)}</span></div>
              {appliedCoupon && <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4, color: "var(--success-500)" }}><span>Descuento</span><span>- S/ {discount.toFixed(2)}</span></div>}
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 15, fontWeight: 700, color: "#fff", marginTop: 4 }}><span>Total</span><span>S/ {total.toFixed(2)}</span></div>
            </div>

            <label style={{ display: "block", marginBottom: 8, fontSize: 12, fontWeight: 500, color: "#9ca3af" }}>Método de pago</label>
            <div style={{ marginBottom: 16, display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 8 }}>
              {PAYMENT_OPTIONS.map((opt) => {
                const IconC = opt.icon;
                const active = payment === opt.value;
                return (
                  <button key={opt.value} onClick={() => setPayment(opt.value)}
                    style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4, borderRadius: 12, padding: 10, fontSize: 12,
                      border: active ? "1px solid var(--accent-500)" : "1px solid var(--base-700)",
                      background: active ? "rgba(34,184,255,.1)" : "transparent", color: active ? "var(--accent-400)" : "#9ca3af" }}>
                    <IconC style={{ width: 16, height: 16 }} />{opt.label}
                  </button>
                );
              })}
            </div>

            <div style={{ marginBottom: 16, borderRadius: 12, border: "1px solid var(--base-700)", background: "rgba(18,22,35,.6)", padding: 12, fontSize: 14, color: "#d1d5db" }}>
              {payment === "yape" && <p style={{ margin: 0 }}>Yapea a: <span style={{ fontWeight: 600, color: "#fff" }}>{settings.yape_number ?? "—"}</span></p>}
              {payment === "transferencia" && (
                <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                  <p style={{ margin: 0 }}>BCP: <span style={{ fontWeight: 600, color: "#fff" }}>{settings.bank_bcp_account ?? "—"}</span></p>
                  <p style={{ margin: 0 }}>Interbank: <span style={{ fontWeight: 600, color: "#fff" }}>{settings.bank_interbank_account ?? "—"}</span></p>
                </div>
              )}
              {qrForPayment && (
                <div style={{ marginTop: 12, display: "flex", justifyContent: "center" }}>
                  <img src={qrForPayment} alt={`QR ${paymentLabel}`} style={{ width: 140, height: 140, objectFit: "contain", borderRadius: 12, border: "1px solid var(--base-700)", background: "#fff" }} />
                </div>
              )}
            </div>

            <div style={{ marginBottom: 16 }}>
              <label style={{ display: "block", marginBottom: 6, fontSize: 12, fontWeight: 500, color: "#9ca3af" }}>Código de operación / Referencia (Yape o BCP)</label>
              <input value={opCode} onChange={(e) => setOpCode(e.target.value)} placeholder="Ej: 000123456"
                style={{ width: "100%", borderRadius: 8, border: "1px solid var(--base-700)", background: "var(--base-800)", padding: "8px 12px", fontSize: 13, color: "#fff" }} />
              <p style={{ margin: "4px 0 0", fontSize: 11, color: "#6b7280" }}>Lo encuentras en el comprobante de Yape o en el detalle de tu transferencia.</p>
            </div>

            <div style={{ marginBottom: 16 }}>
              <label style={{ display: "block", marginBottom: 6, fontSize: 12, fontWeight: 500, color: "#9ca3af" }}>Comprobante de pago (foto o captura, opcional)</label>
              <input type="file" accept="image/*" onChange={handleProofChange}
                style={{ width: "100%", borderRadius: 8, border: "1px solid var(--base-700)", background: "var(--base-800)", padding: "6px 8px", fontSize: 12, color: "#fff" }} />
              {proofPreview && (
                <div style={{ marginTop: 8, display: "flex", alignItems: "center", gap: 10 }}>
                  <img src={proofPreview} alt="Comprobante" style={{ width: 56, height: 56, objectFit: "cover", borderRadius: 8, border: "1px solid var(--base-700)" }} />
                  <span style={{ fontSize: 11, color: "#9ca3af", display: "flex", alignItems: "center", gap: 4 }}><Icon.Paperclip style={{ width: 12, height: 12 }} /> Comprobante adjuntado</span>
                </div>
              )}
            </div>

            <div style={{ marginBottom: 16, display: "flex", flexDirection: "column", gap: 12 }}>
              <div>
                <label style={{ display: "block", marginBottom: 4, fontSize: 12, fontWeight: 500, color: "#9ca3af" }}>Nombre</label>
                <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Tu nombre completo"
                  style={{ width: "100%", borderRadius: 8, border: "1px solid var(--base-700)", background: "var(--base-800)", padding: "8px 12px", fontSize: 14, color: "#fff" }} />
              </div>
              <div>
                <label style={{ display: "block", marginBottom: 4, fontSize: 12, fontWeight: 500, color: "#9ca3af" }}>WhatsApp</label>
                <input value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="+51 9XX XXX XXX"
                  style={{ width: "100%", borderRadius: 8, border: "1px solid var(--base-700)", background: "var(--base-800)", padding: "8px 12px", fontSize: 14, color: "#fff" }} />
              </div>
            </div>

            {error && <p style={{ marginBottom: 12, fontSize: 12, color: "var(--signal-400)" }}>{error}</p>}

            <button onClick={handleConfirm} disabled={loading || uploadingProof}
              style={{ display: "flex", width: "100%", alignItems: "center", justifyContent: "center", gap: 8, borderRadius: 999, background: "var(--success-500)", padding: "12px", fontSize: 14, fontWeight: 600, color: "#fff", border: "none", opacity: (loading || uploadingProof) ? 0.6 : 1 }}>
              {(loading || uploadingProof) && <Icon.Loader className="spin" style={{ width: 16, height: 16 }} />}
              {uploadingProof ? "Subiendo comprobante..." : "Confirmar por WhatsApp"}
            </button>
          </>
        )}
      </div>
    </div>
  );
}

function FAQItem({ faq, open, onToggle }) {

    <div style={{ borderRadius: 12, border: "1px solid var(--base-700)", background: "rgba(18,22,35,.6)", overflow: "hidden" }}>
      <button onClick={onToggle} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", background: "none", border: "none", padding: "14px 16px", textAlign: "left", color: "#fff", fontSize: 14, fontWeight: 600 }}>
        {faq.question}
        <Icon.ChevronDown style={{ width: 16, height: 16, flexShrink: 0, marginLeft: 8, transform: open ? "rotate(180deg)" : "none", transition: "transform .2s", color: "#9ca3af" }} />
      </button>
      {open && <div className="fade-in" style={{ padding: "0 16px 16px", fontSize: 13, color: "#9ca3af", lineHeight: 1.6 }}>{faq.answer}</div>}

}

function FAQSection({ faqs }) {
  const [openId, setOpenId] = useState(null);
  if (!faqs || faqs.length === 0) return null;
  const sorted = [...faqs].sort((a, b) => (a.order || 0) - (b.order || 0));
  return (
    <section style={{ marginTop: 56, maxWidth: 720, marginLeft: "auto", marginRight: "auto" }}>
      <h2 style={{ margin: "0 0 20px", fontSize: 22, fontWeight: 700, textAlign: "center", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
        <Icon.HelpCircle style={{ width: 20, height: 20, color: "var(--accent-400)" }} /> Preguntas frecuentes
      </h2>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {sorted.map((f) => (
          <FAQItem key={f.id} faq={f} open={openId === f.id} onToggle={() => setOpenId((v) => (v === f.id ? null : f.id))} />
        ))}
      </div>
    </section>
  );
}

/* ============================================================
   TIENDA PÚBLICA
   ============================================================ */
const CART_KEY = "digitalstore_cart_v1";

function loadCart() {
  try {
    const raw = localStorage.getItem(CART_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return [];
}
function saveCart(cart) {
  try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch (e) {}
}

function StorePage({ db, setDb }) {
  const [search, setSearch] = useState("");
  const [activeCategory, setActiveCategory] = useState(null);
  const [detailProduct, setDetailProduct] = useState(null);
  const [cartOpen, setCartOpen] = useState(false);
  const [cart, setCart] = useState(loadCart);
  const [toast, setToast] = useState(null);

  useEffect(() => { saveCart(cart); }, [cart]);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 2200);
    return () => clearTimeout(t);
  }, [toast]);

  // Sincroniza el catálogo (productos y categorías) desde Google Sheets al
  // abrir la tienda, y luego cada 5 minutos mientras siga abierta — así los
  // cambios de precio/stock/descripción que hagas en la hoja se reflejan
  // sin que nadie tenga que tocar el panel Admin. No hace nada si no
  // configuraste la URL del CSV en Admin → Configuración.
  useEffect(() => {
    const csvUrl = db.settings.sheet_csv_url;
    const couponsUrl = db.settings.sheet_coupons_csv_url;
    if (!csvUrl && !couponsUrl) return;
    const runSync = () => {
      if (csvUrl) syncCatalogFromSheet(csvUrl, setDb);
      if (couponsUrl) syncCouponsFromSheet(couponsUrl, setDb);
    };
    runSync();
    const interval = setInterval(runSync, 5 * 60 * 1000);
    return () => clearInterval(interval);
  }, [db.settings.sheet_csv_url, db.settings.sheet_coupons_csv_url]);

  const activeProducts = useMemo(() => db.products.filter((p) => p.is_active), [db.products]);

  const filteredProducts = useMemo(() => activeProducts.filter((p) => {
    const q = search.toLowerCase();
    const matchesSearch = p.title.toLowerCase().includes(q) || (p.description || "").toLowerCase().includes(q);
    const matchesCategory = !activeCategory || db.categories.find((c) => c.id === p.category_id)?.slug === activeCategory;
    return matchesSearch && matchesCategory;
  }), [activeProducts, db.categories, search, activeCategory]);

  function addToCart(product, planId, qty) {
    setCart((prev) => {
      const existing = prev.find((it) => it.product_id === product.id && it.plan_id === planId);
      if (existing) {
        return prev.map((it) => it.id === existing.id ? { ...it, qty: it.qty + qty } : it);
      }
      return [...prev, { id: uid(), product_id: product.id, plan_id: planId, qty }];
    });
    setToast(`✓ "${product.title}" añadido al carrito`);
  }

  function updateCartQty(itemId, qty) {
    setCart((prev) => prev.map((it) => it.id === itemId ? { ...it, qty } : it));
  }
  function removeFromCart(itemId) {
    setCart((prev) => prev.filter((it) => it.id !== itemId));
  }

  function handleCreateOrders(orders) {
    setDb((prev) => {
      const next = { ...prev, orders: [...orders, ...prev.orders] };
      saveDB(next);
      return next;
    });
    const productsById = Object.fromEntries(db.products.map((p) => [p.id, p]));
    const ordersWithTitle = orders.map((o) => ({ ...o, product_title: (productsById[o.product_id] || {}).title || "" }));
    sendToSheet(db.settings.sheet_orders_webhook_url, "order", ordersWithTitle);
  }

  function handleAddReview(review) {
    setDb((prev) => {
      const next = { ...prev, reviews: [review, ...(prev.reviews || [])] };
      saveDB(next);
      return next;
    });
    const product = db.products.find((p) => p.id === review.product_id);
    sendToSheet(db.settings.sheet_orders_webhook_url, "review", [{ ...review, product_title: product ? product.title : "" }]);
  }

  const cartCount = cart.reduce((sum, it) => sum + it.qty, 0);

  return (
    <div style={{ minHeight: "100vh" }}>
      <Header categories={db.categories} search={search} onSearchChange={setSearch} activeCategory={activeCategory} onCategoryChange={setActiveCategory}
        whatsappNumber={db.settings.whatsapp_number} cartCount={cartCount} onOpenCart={() => setCartOpen(true)} announcement={db.settings.announcement} />
      <main style={{ maxWidth: 1280, margin: "0 auto", padding: "32px 16px" }}>
        <section style={{ marginBottom: 40, textAlign: "center" }}>
          <h1 style={{ margin: "0 0 8px", fontSize: 30, fontWeight: 700, color: "#fff" }}>Productos y suscripciones digitales</h1>
          <p style={{ margin: 0, color: "#9ca3af" }}>Membresías, cursos, licencias y plantillas — pago fácil con Yape o transferencia BCP.</p>
        </section>
        <CatalogGrid products={filteredProducts} onSelect={setDetailProduct} onQuickAdd={addToCart} />
        <FAQSection faqs={db.faqs || []} />
      </main>
      <footer style={{ borderTop: "1px solid var(--base-700)", padding: "24px 16px", textAlign: "center", color: "#6b7280", fontSize: 12 }}>
        <p style={{ margin: 0 }}>DigitalStore Perú</p>
      </footer>

      {detailProduct && (
        <ProductDetailModal
          product={detailProduct}
          allProducts={activeProducts}
          reviews={db.reviews || []}
          onAddReview={handleAddReview}
          onClose={() => setDetailProduct(null)}
          onAddToCart={addToCart}
          onSelectProduct={setDetailProduct}
        />
      )}

      {cartOpen && (
        <CartModal
          cart={cart}
          products={db.products}
          settings={db.settings}
          coupons={db.coupons || []}
          onClose={() => setCartOpen(false)}
          onUpdateQty={updateCartQty}
          onRemove={removeFromCart}
          onCreateOrders={handleCreateOrders}
          onCleared={() => setCart([])}
        />
      )}

      {toast && (
        <div className="fade-in" style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", zIndex: 60, background: "var(--success-500)", color: "#fff", padding: "10px 20px", borderRadius: 999, fontSize: 13, fontWeight: 500, boxShadow: "0 8px 20px rgba(0,0,0,.4)" }}>
          {toast}
        </div>
      )}
    </div>
  );
}
